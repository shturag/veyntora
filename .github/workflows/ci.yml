name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.13.6"
  PNPM_VERSION: "12.16.1"
  NODE_VERSION: "24.22.2"
  TRIVY_IMAGE: aquasec/trivy:0.76.1
  SYFT_IMAGE: anchore/syft:v1.55.0
  FGA_CLI_IMAGE: openfga/cli:v0.8.2

jobs:
  python:
    name: Python · lint, types, tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
      - run: uv sync --all-packages --frozen
      - run: uv run ruff check packages services
      - run: uv run ruff format --check packages services
      - run: uv run mypy packages/spec/src packages/providers/src services/api/src services/graphs/src services/workers/src
      # Database tests start PostgreSQL 16 with testcontainers.
      - run: uv run pytest -q

  web:
    name: Web · lint, types, unit tests, build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @veyntora/web lint
      - run: pnpm -r typecheck
      - run: pnpm --filter @veyntora/web test
      - run: pnpm --filter @veyntora/web build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  contracts:
    name: Generated code and authorization model
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: uv sync --all-packages --frozen
      - run: pnpm install --frozen-lockfile
      - name: OpenFGA model tests
        run: docker run --rm -v "$PWD/deploy/openfga:/w" -w /w "$FGA_CLI_IMAGE" model test --tests model.tests.fga.yaml
      - name: OpenAPI, TS client, spec schema and FGA JSON are up to date
        run: make check-gen

  images:
    name: Images · build, SBOM, scan
    runs-on: ubuntu-24.04
    needs: [python, web]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - { name: api, dockerfile: services/api/Dockerfile }
          - { name: graphs, dockerfile: services/graphs/Dockerfile }
          - { name: web, dockerfile: apps/web/Dockerfile }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          load: true
          tags: veyntora/${{ matrix.image.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}
      - name: Image runs as non-root
        run: |
          user=$(docker image inspect veyntora/${{ matrix.image.name }}:${{ github.sha }} --format '{{.Config.User}}')
          echo "user=$user"
          [ -n "$user" ] && [ "$user" != "root" ] && [ "$user" != "0" ] && [ "${user%%:*}" != "0" ]
      - name: SBOM (SPDX)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/out" "$SYFT_IMAGE" \
            veyntora/${{ matrix.image.name }}:${{ github.sha }} -o spdx-json=/out/sbom-${{ matrix.image.name }}.spdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ matrix.image.name }}
          path: sbom-${{ matrix.image.name }}.spdx.json
      - name: Vulnerability scan (fail on fixable HIGH/CRITICAL)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" image \
            --exit-code 1 --ignore-unfixed --severity HIGH,CRITICAL --scanners vuln \
            veyntora/${{ matrix.image.name }}:${{ github.sha }}
      - name: Push to GHCR (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/veyntora-${{ matrix.image.name }}"
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag veyntora/${{ matrix.image.name }}:${{ github.sha }} "$repo:${{ github.sha }}"
          docker push "$repo:${{ github.sha }}"

  dev-bump:
    # dev follows main: point its values at the images just pushed; Argo CD syncs dev
    # automatically. staging and prod stay manual (a person sets image.tag).
    name: Deploy · bump dev to this commit
    runs-on: ubuntu-24.04
    needs: [images]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set image.tag in deploy/helm/values/dev
        run: |
          set -eu
          for f in deploy/helm/values/dev/*.yaml; do
            sed -i -E "s/^(  tag: ).*$/\1\"${GITHUB_SHA}\"/" "$f"
          done
          git diff --stat
      - name: Commit
        run: |
          set -eu
          if git diff --quiet; then exit 0; fi
          git config user.name "veyntora-ci"
          git config user.email "ci@users.noreply.github.com"
          git commit -am "deploy(dev): images ${GITHUB_SHA::12} [skip ci]"
          git push

  dependencies:
    name: Dependency scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Scan lock files (uv.lock, pnpm-lock.yaml)
        run: |
          docker run --rm -v "$PWD:/src" "$TRIVY_IMAGE" fs --scanners vuln \
            --exit-code 1 --ignore-unfixed --severity HIGH,CRITICAL /src

  e2e:
    name: Stack · end-to-end and integration
    runs-on: ubuntu-24.04
    needs: [python, web]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: scripts/gen-env.sh
      # The model servers (TEI, Docling) and Langfuse are not needed for Phase 0 flows and
      # would download several GB per run; `web` pulls in everything it depends on.
      - name: Start the stack
        run: docker compose up -d --build --wait web graphs workers scheduler
      - run: uv sync --all-packages --frozen
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @veyntora/web exec playwright install --with-deps chromium
      - name: Secrets policy (write-only API token)
        run: make test-integration
      - name: Playwright
        run: |
          set -a; source .env; set +a
          pnpm --filter @veyntora/web exec playwright test
      - if: failure()
        run: docker compose logs --no-color > compose.log
      - name: Server errors (on failure)
        if: failure()
        # The services' tracebacks, shown here so a failure explains itself.
        run: grep -n -A40 "Traceback" compose.log | tail -300 || echo "no tracebacks in compose.log"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report
          path: |
            apps/web/playwright-report
            compose.log
          if-no-files-found: ignore
