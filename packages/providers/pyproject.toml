[project]
name = "veyntora-providers"
version = "1.0.0"
description = "Veyntora provider interfaces, adapters and the shared contract test suite"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
  "pydantic==2.14.3",
  "httpx==0.28.1",
  "anthropic==2.3.0",
  "qdrant-client==1.20.0",
  # pgvector: chunks in PostgreSQL (ADR 0042).
  "asyncpg==0.32.0",
  "mcp==2.3.0",
]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/veyntora_providers"]
