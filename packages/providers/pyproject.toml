[project]
name = "veyntora-providers"
version = "0.1.0"
description = "Veyntora provider interfaces, adapters and the shared contract test suite"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic==2.14.2",
  "httpx==0.28.1",
  "anthropic==2.3.0",
  "qdrant-client==1.20.0",
  "mcp==2.3.0",
]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/veyntora_providers"]
