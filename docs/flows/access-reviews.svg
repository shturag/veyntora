<text x="20.0" y="352.0" font-size="11.5" font-weight="700" fill="#334155" text-anchor="start" letter-spacing="0.6">OWNERS</text>
<text x="20.0" y="369.0" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start">chatbots, groups</text>
<rect x="1" y="484.0" width="958" height="140" fill="#f8fafc"/>
<line x1="1" x2="959" y1="484.0" y2="484.0" stroke="#e2e8f0"/>
