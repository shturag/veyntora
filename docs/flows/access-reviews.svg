<text x="582.0" y="141.0" font-size="14" font-weight="600" fill="#0f172a" text-anchor="start">Undecided</text>
<text x="582.0" y="160.0" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">access stays;</text>
<text x="582.0" y="176.0" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">round overdue</text>
<clipPath id="clip-access-reviews-review"><rect x="364.0" y="262.0" width="168.0" height="64" rx="10"/></clipPath>
<rect x="364.0" y="262.0" width="168.0" height="64" rx="10" fill="#fffbeb" stroke="#fcd34d"/>
<rect x="364.0" y="262.0" width="5" height="64" fill="#d97706" clip-path="url(#clip-access-reviews-review)"/>
<text x="382.0" y="289.0" font-size="14" font-weight="600" fill="#0f172a" text-anchor="start">Keep this grant?</text>
<text x="382.0" y="308.0" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">role or membership</text>
<clipPath id="clip-access-reviews-keep"><rect x="564.0" y="262.0" width="168.0" height="64" rx="10"/></clipPath>
<rect x="564.0" y="262.0" width="168.0" height="64" rx="10" fill="#f0fdf4" stroke="#86efac"/>
<rect x="564.0" y="262.0" width="5" height="64" fill="#16a34a" clip-path="url(#clip-access-reviews-keep)"/>
<text x="582.0" y="289.0" font-size="14" font-weight="600" fill="#0f172a" text-anchor="start">Kept</text>
<text x="582.0" y="308.0" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">access stays</text>
<clipPath id="clip-access-reviews-revoke"><rect x="564.0" y="374.0" width="168.0" height="80" rx="10"/></clipPath>
<rect x="564.0" y="374.0" width="168.0" height="80" rx="10" fill="#fef2f2" stroke="#fca5a5"/>
<rect x="564.0" y="374.0" width="5" height="80" fill="#dc2626" clip-path="url(#clip-access-reviews-revoke)"/>
<text x="582.0" y="401.0" font-size="14" font-weight="600" fill="#0f172a" text-anchor="start">Revoked</text>
<text x="582.0" y="420.0" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">audited; never the</text>
<text x="582.0" y="436.0" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">last owner</text>
<clipPath id="clip-access-reviews-close"><rect x="764.0" y="522.0" width="168.0" height="64" rx="10"/></clipPath>
<rect x="764.0" y="522.0" width="168.0" height="64" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
<rect x="764.0" y="522.0" width="5" height="64" fill="#6366f1" clip-path="url(#clip-access-reviews-close)"/>
<text x="782.0" y="549.0" font-size="14" font-weight="600" fill="#0f172a" text-anchor="start">Close the round</text>
<text x="782.0" y="568.0" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">all decided</text>

<text x="548.0" y="287.0" font-size="11.5" font-weight="500" fill="#475569" text-anchor="middle">keep</text>
<rect x="478.8" y="403.0" width="54.5" height="22" rx="11" fill="#ffffff" stroke="#e2e8f0"/><text x="506.0" y="418.0" font-size="11.5" font-weight="500" fill="#475569" text-anchor="middle">revoke</text>
<rect x="397.8" y="197.0" width="100.5" height="22" rx="11" fill="#ffffff" stroke="#e2e8f0"/><text x="448.0" y="212.0" font-size="11.5" font-weight="500" fill="#475569" text-anchor="middle">nobody decides</text>



<text x="24.0" y="658.0" font-size="12" font-weight="600" fill="#0f172a" text-anchor="start">Key</text>
