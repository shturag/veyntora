<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 676" width="960" height="676" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Access reviews">
<title>Access reviews</title>
<defs><marker id="arrow-access-reviews" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker></defs>
<rect x="0.5" y="0.5" width="959" height="675.0" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
<text x="24.0" y="36.0" font-size="20" font-weight="700" fill="#0f172a" text-anchor="start">Access reviews</text>
<text x="24.0" y="60.0" font-size="13" font-weight="400" fill="#64748b" text-anchor="start">Owners confirm who still needs access; nothing undecided is removed.</text>
<rect x="1" y="84.0" width="958" height="140" fill="#f8fafc"/>
