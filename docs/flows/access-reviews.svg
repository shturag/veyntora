<text x="364.0" y="658.0" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">Outcome</text>
<rect x="432.0" y="647.0" width="22" height="14" rx="3" fill="#fef2f2" stroke="#fca5a5"/>
<rect x="432.0" y="647.0" width="4" height="14" fill="#dc2626"/>
