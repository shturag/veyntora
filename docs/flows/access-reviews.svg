<text x="20.0" y="569.0" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start">closes rounds</text>
<line x1="1" x2="959" y1="624.0" y2="624.0" stroke="#e2e8f0"/>
<path d="M248.0 191.0 L248.0 284.0 Q248.0 294.0 258.0 294.0 L364.0 294.0" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrow-access-reviews)"/>
