<text x="20.0" y="152.0" font-size="11.5" font-weight="700" fill="#334155" text-anchor="start" letter-spacing="0.6">VEYNTORA</text>
<text x="20.0" y="169.0" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start">starts rounds</text>
<rect x="1" y="224.0" width="958" height="260" fill="#ffffff"/>
<line x1="1" x2="959" y1="224.0" y2="224.0" stroke="#e2e8f0"/>
