<text x="248.0" y="143.5" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">Round starts</text>
<text x="248.0" y="161.5" font-size="11.5" font-weight="400" fill="#cbd5e1" text-anchor="middle">every 90 days</text>
<text x="248.0" y="176.5" font-size="11.5" font-weight="400" fill="#cbd5e1" text-anchor="middle">or by hand</text>
<clipPath id="clip-access-reviews-overdue"><rect x="564.0" y="114.0" width="168.0" height="80" rx="10"/></clipPath>
<rect x="564.0" y="114.0" width="168.0" height="80" rx="10" fill="#fef2f2" stroke="#fca5a5"/>
