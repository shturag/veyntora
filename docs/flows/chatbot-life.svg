<text x="782.0" y="288.0" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">10%, then 50%</text>
<clipPath id="clip-chatbot-life-live"><rect x="964.0" y="242.0" width="168.0" height="64" rx="10"/></clipPath>
<rect x="964.0" y="242.0" width="168.0" height="64" rx="10" fill="#f0fdf4" stroke="#86efac"/>
