<text x="382.0" y="160.0" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">pipeline, flow;</text>
<text x="382.0" y="176.0" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">Playground test</text>
<clipPath id="clip-chatbot-life-eval"><rect x="564.0" y="114.0" width="168.0" height="80" rx="10"/></clipPath>
