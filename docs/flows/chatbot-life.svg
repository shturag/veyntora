<rect x="564.0" y="374.0" width="5" height="80" fill="#d97706" clip-path="url(#clip-chatbot-life-gate)"/>
<text x="582.0" y="401.0" font-size="14" font-weight="600" fill="#0f172a" text-anchor="start">Gate passed?</text>
<text x="582.0" y="420.0" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">faithfulness,</text>
<text x="582.0" y="436.0" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">relevance, no drop</text>
<clipPath id="clip-chatbot-life-guard"><rect x="764.0" y="374.0" width="168.0" height="80" rx="10"/></clipPath>
<rect x="764.0" y="374.0" width="168.0" height="80" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
<rect x="764.0" y="374.0" width="5" height="80" fill="#6366f1" clip-path="url(#clip-chatbot-life-guard)"/>
<text x="782.0" y="401.0" font-size="14" font-weight="600" fill="#0f172a" text-anchor="start">Guard</text>
<text x="782.0" y="420.0" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">every 5 min; rolls</text>
<text x="782.0" y="436.0" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">back if clearly worse</text>
<clipPath id="clip-chatbot-life-back"><rect x="964.0" y="374.0" width="168.0" height="80" rx="10"/></clipPath>
