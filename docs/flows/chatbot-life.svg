<text x="982.0" y="420.0" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">live again, with</text>
<text x="982.0" y="436.0" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">a reason, audited</text>



