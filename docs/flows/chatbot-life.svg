<text x="582.0" y="141.0" font-size="14" font-weight="600" fill="#0f172a" text-anchor="start">Run evaluation</text>
<text x="582.0" y="160.0" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">required sets,</text>
<text x="582.0" y="176.0" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">against live</text>
<clipPath id="clip-chatbot-life-canary"><rect x="764.0" y="242.0" width="168.0" height="64" rx="10"/></clipPath>
