<text x="20.0" y="492.0" font-size="11.5" font-weight="700" fill="#334155" text-anchor="start" letter-spacing="0.6">VEYNTORA</text>
<text x="20.0" y="509.0" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start">carries it out</text>
<rect x="1" y="624.0" width="1158" height="140" fill="#ffffff"/>
