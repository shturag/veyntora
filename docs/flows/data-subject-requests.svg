<text x="20.0" y="169.0" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start">Governance editor</text>
<text x="20.0" y="183.0" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start">or DPO</text>
<rect x="1" y="224.0" width="1158" height="140" fill="#ffffff"/>
