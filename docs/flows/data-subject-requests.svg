<defs><marker id="arrow-data-subject-requests" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker></defs>
<rect x="0.5" y="0.5" width="1159" height="815.0" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
<text x="24.0" y="36.0" font-size="20" font-weight="700" fill="#0f172a" text-anchor="start">Data subject requests</text>
<text x="24.0" y="60.0" font-size="13" font-weight="400" fill="#64748b" text-anchor="start">Nothing is erased or exported without a DPO who did not ask for it.</text>
