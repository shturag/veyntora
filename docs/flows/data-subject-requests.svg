<text x="20.0" y="292.0" font-size="11.5" font-weight="700" fill="#334155" text-anchor="start" letter-spacing="0.6">DPO</text>
<text x="20.0" y="309.0" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start">never the requester</text>
<rect x="1" y="364.0" width="1158" height="260" fill="#f8fafc"/>
<line x1="1" x2="1159" y1="364.0" y2="364.0" stroke="#e2e8f0"/>
