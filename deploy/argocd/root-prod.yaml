# App of apps for prod. Apply once: kubectl apply -n argocd -f deploy/argocd/root-prod.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: veyntora-prod
  namespace: argocd
spec:
  project: veyntora
  source:
    repoURL: https://github.com/shturag/veyntora.git
    targetRevision: main
    path: deploy/argocd/apps/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
