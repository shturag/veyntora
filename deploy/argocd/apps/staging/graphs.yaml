apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: veyntora-graphs-staging
  namespace: argocd
spec:
  project: veyntora
  source:
    repoURL: https://github.com/shturag/veyntora.git
    targetRevision: main
    path: deploy/helm/veyntora-service
    helm:
      releaseName: graphs
      valueFiles:
        - ../values/staging/graphs.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: veyntora-staging
  # Manual sync: promoted after approval (see docs/runbooks/deploy.md).
  syncPolicy:
    syncOptions: [CreateNamespace=true]
