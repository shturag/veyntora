# App of apps for dev. Apply once: kubectl apply -n argocd -f deploy/argocd/root-dev.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: veyntora-dev
  namespace: argocd
spec:
  project: veyntora
  source:
    repoURL: https://github.com/shturag/veyntora.git
    targetRevision: main
    path: deploy/argocd/apps/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated: { prune: true, selfHeal: true }
