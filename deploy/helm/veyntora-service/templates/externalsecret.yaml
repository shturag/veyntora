{{- range .Values.externalSecrets }}
---
# Filled from OpenBao by the External Secrets Operator; never committed.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .name }}
  labels: {{- include "svc.labels" $ | nindent 4 }}
spec:
  refreshInterval: {{ .refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ .store.name }}
    kind: {{ .store.kind | default "ClusterSecretStore" }}
  target:
    name: {{ .name }}
    creationPolicy: Owner
  data:
    {{- range $env, $ref := .data }}
    - secretKey: {{ $env }}
      remoteRef:
        key: {{ $ref.key }}
        property: {{ $ref.property }}
    {{- end }}
{{- end }}
