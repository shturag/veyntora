apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "svc.name" . }}
  labels: {{- include "svc.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels: {{- include "svc.selector" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "svc.labels" . | nindent 8 }}
      {{- if or .Values.podAnnotations .Values.openbao.enabled }}
      annotations:
        {{- with .Values.podAnnotations }}{{ toYaml . | nindent 8 }}{{- end }}
        {{- if .Values.openbao.enabled }}
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/agent-inject-token: "true"
        vault.hashicorp.com/role: {{ required "openbao.role is required" .Values.openbao.role | quote }}
        vault.hashicorp.com/agent-pre-populate-only: "false"
        {{- end }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "svc.name" . }}
      # Only the OpenBao agent needs the service account token (Kubernetes auth).
      automountServiceAccountToken: {{ .Values.openbao.enabled }}
      securityContext:
        fsGroup: {{ .Values.runAsUser }}
      containers:
        - name: {{ include "svc.name" . }}
          image: "{{ .Values.image.repository }}:{{ required "image.tag is required" .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.command }}
          command: {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext: {{- include "svc.securityContext" . | nindent 12 }}
          env:
            {{- include "svc.env" . | nindent 12 }}
            {{- if .Values.openbao.enabled }}
            - name: VEY_OPENBAO_TOKEN_FILE
              value: {{ .Values.openbao.tokenPath | quote }}
            {{- end }}
          {{- with .Values.envFromSecrets }}
          envFrom:
            {{- range . }}
            - secretRef: { name: {{ . }} }
            {{- end }}
          {{- end }}
          {{- if .Values.service.enabled }}
          ports:
            - name: http
              containerPort: {{ .Values.port }}
          readinessProbe:
            httpGet: { path: {{ .Values.healthPath }}, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: {{ .Values.healthPath }}, port: http }
            periodSeconds: 20
            failureThreshold: 6
          {{- end }}
          resources: {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
