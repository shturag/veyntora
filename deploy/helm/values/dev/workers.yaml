# workers · dev. image.tag is set by CI (commit SHA); secrets come from ExternalSecrets/OpenBao.
nameOverride: workers
image:
  repository: ghcr.io/shturag/veyntora-api
  tag: "a180c43f9158f7d87e6e1792caa0d0731e9b89cb"
replicas: 1
port: 8000
healthPath: /
command: ["celery", "-A", "veyntora_workers.app", "worker", "--loglevel=INFO"]
envFromSecrets: [veyntora-api-env]
service:
  enabled: false
# Read-only OpenBao role: reads provider, connector and own-model keys at use.
openbao:
  enabled: true
  role: veyntora-runtime
