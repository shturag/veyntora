# web · dev. image.tag is set by CI (commit SHA); secrets come from ExternalSecrets/OpenBao.
nameOverride: web
image:
  repository: ghcr.io/shturag/veyntora-web
  tag: "c2aabd51851030dece7a9c7e1b69fcadade6c110"
replicas: 1
port: 3000
healthPath: /sign-in
allowIngressFrom: [ingress-nginx]
runAsUser: 1000
env:
  API_INTERNAL_URL: http://api:8000
# Public entry; set host to the installation's name. TLS from cert-manager.
ingress:
  enabled: true
  host: veyntora.dev.example.com
  tlsSecret: veyntora-web-tls
  clusterIssuer: letsencrypt
