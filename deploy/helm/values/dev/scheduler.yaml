# scheduler · dev. image.tag is set by CI (commit SHA); secrets come from ExternalSecrets/OpenBao.
nameOverride: scheduler
image:
  repository: ghcr.io/shturag/veyntora-api
  tag: "e5c2a913bb895f310e8bdeafe2cecd7c390a01bb"
replicas: 1  # beat must be a singleton
port: 8000
healthPath: /
command: ["celery", "-A", "veyntora_workers.app", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]
envFromSecrets: [veyntora-api-env]
service:
  enabled: false
# Read-only OpenBao role: reads provider, connector and own-model keys at use.
openbao:
  enabled: true
  role: veyntora-runtime
