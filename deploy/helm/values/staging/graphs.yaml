# graphs · staging. image.tag is set by CI (commit SHA); secrets come from ExternalSecrets/OpenBao.
nameOverride: graphs
image:
  repository: ghcr.io/shturag/veyntora-graphs
  tag: ""
replicas: 2
port: 2026
healthPath: /health
envFromSecrets: [veyntora-api-env]
# Read-only OpenBao role: reads provider, connector and own-model keys at use.
openbao:
  enabled: true
  role: veyntora-runtime
