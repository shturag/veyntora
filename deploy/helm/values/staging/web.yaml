# web · staging. image.tag is set by CI (commit SHA); secrets come from ExternalSecrets/OpenBao.
nameOverride: web
image:
  repository: ghcr.io/shturag/veyntora-web
  tag: ""
replicas: 2
port: 3000
healthPath: /sign-in
allowIngressFrom: [ingress-nginx]
runAsUser: 1000
env:
  API_INTERNAL_URL: http://api:8000
# Public entry; set host to the installation's name. TLS from cert-manager.
ingress:
  enabled: true
  host: veyntora.staging.example.com
  tlsSecret: veyntora-web-tls
  clusterIssuer: letsencrypt
