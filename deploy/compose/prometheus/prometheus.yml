global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: api
    static_configs:
      - targets: ["api:8000"]
  - job_name: graphs
    static_configs:
      - targets: ["graphs:2026"]
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
  - job_name: openfga
    static_configs:
      - targets: ["openfga:2112"]
