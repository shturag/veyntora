# Pattern recognizers for English and German text. Names and places come from the NLP
# models (nlp.yaml). URLs and dates are left alone: they are rarely personal.
supported_languages:
  - en
  - de
global_regex_flags: 26

recognizers:
  - name: SpacyRecognizer
    type: predefined
  - name: CreditCardRecognizer
    supported_languages:
      - language: en
        context: [credit, card, visa, mastercard, amex]
      - language: de
        context: [kreditkarte, karte, visa, mastercard, amex]
    type: predefined
  - name: EmailRecognizer
    type: predefined
  - name: IbanRecognizer
    type: predefined
  - name: PhoneRecognizer
    supported_languages:
      - language: en
      - language: de
        context: [telefon, tel, handy, mobil, rufnummer, fax]
    type: predefined
  - name: IpRecognizer
    type: predefined
  - name: CryptoRecognizer
    type: predefined
  - name: MedicalLicenseRecognizer
    type: predefined
