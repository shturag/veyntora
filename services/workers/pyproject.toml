[project]
name = "veyntora-workers"
version = "0.1.0"
description = "Veyntora background jobs: ingestion, sync, eval, retention; scheduler"
requires-python = ">=3.12,<3.13"
dependencies = [
  "veyntora-api",
  "celery[redis]==5.6.3",
  # Evaluation sets (veyntora-eval).
  "pyyaml==6.0.3",
  # Connectors (ADR 0023): file shares, and databases beyond PostgreSQL (asyncpg).
  "smbprotocol==1.17.0",
  "python-tds==1.17.1",
  "aiomysql==0.3.2",
  "oracledb==26.0.1",
]

[project.scripts]
veyntora-eval = "veyntora_workers.evaluation:main"

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/veyntora_workers"]
