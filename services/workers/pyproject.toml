[project]
name = "veyntora-workers"
version = "0.1.0"
description = "Veyntora background jobs: ingestion, sync, eval, retention; scheduler"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
  "veyntora-api",
  "celery[redis]==5.6.3",
  # Evaluation sets (veyntora-eval).
  "pyyaml==6.0.3",
  # Connectors (ADR 0023): file shares, and databases beyond PostgreSQL (asyncpg).
  "smbprotocol==1.17.0",
  "python-tds==1.17.1",
  "aiomysql==0.3.2",
  "oracledb==26.0.1",
  # Fast text extraction from PDFs' text layer (ADR 0040), in-house, BSD-3-Clause.
  "pypdf==6.21.4",
  # Websites built by scripts, read through the browser service (ADR 0041); Apache-2.0.
  # Must match the browser image (deploy/compose: mcr.microsoft.com/playwright:v1.64.1).
  "playwright==1.64.1",
]

[project.scripts]
veyntora-eval = "veyntora_workers.evaluation:main"

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/veyntora_workers"]
