[project]
name = "veyntora-api"
version = "0.1.0"
description = "Veyntora API: auth, config, admin endpoints, MCP gateway"
requires-python = ">=3.12,<3.13"
dependencies = [
  "veyntora-spec",
  "veyntora-providers",
  "fastapi==0.162.0",
  "uvicorn[standard]==0.54.0",
  "pydantic==2.14.2",
  "pydantic-settings==2.16.2",
  "sqlalchemy[asyncio]==2.1.6",
  "alembic==1.20.1",
  "asyncpg==0.32.0",
  "httpx==0.28.1",
  "pyjwt[crypto]==2.15.1",
  # Encrypts the OpenBao tokens in the infrastructure config (already locked via pyjwt).
  "cryptography==50.0.2",
  "openfga-sdk==0.10.5",
  "redis==8.1.0",
  "structlog==26.1.0",
  "asgi-correlation-id==5.0.1",
  "aioboto3==15.5.0",
  "prometheus-client==0.26.0",
  "email-validator==2.3.0",
  "python-multipart==0.0.32",
  # Answer traces to Langfuse over OTLP (veyntora_api.rag.tracing, ADR 0014).
  "opentelemetry-sdk==1.45.2",
  "opentelemetry-exporter-otlp-proto-http==1.45.2",
  # Automation schedules: cron and next runs (already locked through aegra), holidays
  # to skip (ADR 0021).
  "croniter==6.2.4",
  "holidays==0.106",
]

[project.scripts]
veyntora-api = "veyntora_api.cli:main"

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/veyntora_api"]
