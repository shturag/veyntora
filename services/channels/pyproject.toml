[project]
name = "veyntora-channels"
version = "0.1.0"
description = "Veyntora chat channels: Microsoft Teams and Slack bots (runtime service)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "veyntora-api",
  # Product owner, 2026-10-31: Microsoft 365 Agents SDK for Teams; the official Slack SDK.
  "microsoft-agents-hosting-core==1.8.0",
  "microsoft-agents-activity==1.8.0",
  "microsoft-agents-authentication-msal==1.8.0",
  "microsoft-agents-hosting-fastapi==1.8.0",
  "slack-sdk==3.45.0",
  "fastapi==0.162.0",
  "uvicorn[standard]==0.54.0",
  "httpx==0.28.1",
]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/veyntora_channels"]
